<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=240, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070d18" />
<meta name="description" content="Theory Lab r1: a small-screen formulation deck-builder for health and social care education." />
<title>Theory Lab r1</title>
<style>
:root{
  --ink:#070d18;--navy:#0d1728;--navy2:#111d31;--panel:#0b1525;--panel2:#101d30;
  --gold:#f2b927;--gold2:#ffda53;--amber:#e67f00;--cyan:#20d8ee;--teal:#23d6b5;
  --green:#3fdda2;--purple:#8e6bf0;--red:#ff5f66;--text:#f6f1e8;--muted:#aeb8ca;--line:#384963;
  color-scheme:dark;font-family:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:240px;min-width:240px;height:282px;min-height:282px;overflow:hidden;background:var(--ink);color:var(--text);-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
button,input,select{font:inherit}
#app{width:240px;height:282px;overflow:hidden;background:var(--ink)}
#app.flash{animation:flash .11s ease-out}
@keyframes flash{0%{filter:brightness(1.16)}100%{filter:none}}

.screen{position:relative;width:240px;height:282px;overflow:hidden;display:flex;flex-direction:column;background:
  linear-gradient(rgba(6,12,22,.79),rgba(7,13,24,.93)),url('../assets/images/bg_case_board.png') center/cover no-repeat}
.topbar{height:26px;min-height:26px;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;background:rgba(8,15,27,.97);border-bottom:1px solid rgba(230,127,0,.55);box-shadow:0 3px 10px rgba(0,0,0,.35);font-family:Arial,sans-serif}
.brand{font-weight:900;font-size:10px;letter-spacing:.08em;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-mini{font-weight:800;font-size:8px;letter-spacing:.05em;color:#c3cbd8;white-space:nowrap}
.controls{height:22px;min-height:22px;margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 7px;background:rgba(5,10,19,.98);border-top:1px solid #28364a;color:#8f9bae;font:700 8px/1 Arial,sans-serif;letter-spacing:.02em}
.controls span:last-child{color:#e5c55d;text-align:right}
.toast{position:absolute;left:9px;right:9px;bottom:27px;z-index:20;background:#2b2109;border:1px solid var(--gold);color:#ffdf77;border-radius:6px;padding:6px 8px;font:800 9px/1.2 Arial,sans-serif;text-align:center;box-shadow:0 5px 15px rgba(0,0,0,.45)}
.eyebrow{font:900 8px/1.1 Arial,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:var(--gold)}
.dots{height:10px;min-height:10px;display:flex;justify-content:center;align-items:center;gap:3px;padding:1px 0}
.dots i{width:4px;height:4px;border-radius:50%;background:#465268;border:1px solid #68758a}
.dots i.on{width:10px;border-radius:4px;background:var(--gold2);border-color:#fff2a0}

/* Home */
.home-hero{height:91px;min-height:91px;display:flex;align-items:center;gap:9px;padding:8px 12px 4px}
.mark{width:47px;height:47px;min-width:47px;border-radius:50%;display:grid;place-items:center;background:rgba(242,185,39,.12);border:2px solid var(--gold);color:#ffd84c;font-size:24px;box-shadow:0 0 20px rgba(242,185,39,.16)}
.home-hero h1{margin:0;color:#ffcf35;font-size:27px;line-height:.82;letter-spacing:.01em;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.home-hero p{margin:5px 0 0;color:#d7c28b;font-size:10px;font-style:italic}
.menu-window{height:143px;min-height:143px;margin:0 8px;overflow:hidden;border:1px solid #283952;border-radius:8px;background:rgba(8,15,28,.88);box-shadow:0 8px 22px rgba(0,0,0,.3) inset}
.menu-track{transition:transform .14s ease}
.menu-list{margin:6px 8px;display:grid;gap:5px;min-height:0;overflow:hidden}
.menu-list.compact{margin-top:5px}
.menu-row{height:39px;min-height:39px;border:1px solid #34445d;background:#111d30;border-radius:7px;padding:5px 7px;display:flex;flex-direction:column;justify-content:center;color:#e5e9ef;font-family:Arial,sans-serif;box-shadow:0 2px 0 rgba(0,0,0,.24)}
.menu-row b{font-size:9px;letter-spacing:.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-row small{font-size:8px;color:#9eabbc;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-row.selected{border-color:#ffcf35;background:linear-gradient(90deg,#35220a,#18243a);box-shadow:0 0 0 1px rgba(255,207,53,.25),0 3px 0 rgba(0,0,0,.3);transform:translateX(2px)}
.menu-row.selected b{color:#ffda53}

/* Setup / dossier */
.case-ticket{margin:10px 9px 5px;padding:10px 11px 9px;min-height:201px;border:1px solid rgba(230,127,0,.65);border-radius:11px;background:linear-gradient(180deg,rgba(14,26,44,.97),rgba(7,16,29,.98));box-shadow:0 10px 25px rgba(0,0,0,.35)}
.case-ticket h2{font-size:20px;line-height:1.02;margin:7px 0 4px;color:#ffd13d}
.person{font:700 10px Arial,sans-serif;color:#54dfec;margin:0 0 8px}
.case-sub{font-size:13px;line-height:1.23;color:#e5e6e8;margin:0 0 10px;font-style:italic}
.sector{display:inline-block;border:1px solid #43536b;background:#18263b;border-radius:6px;padding:5px 7px;color:#bcc6d4;font:800 8px Arial,sans-serif}
.centre-card,.pass-card{margin:18px 12px 10px;min-height:196px;border:1px solid #4a5a70;border-radius:13px;background:rgba(10,20,35,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.centre-card p,.pass-card p{font-size:12px;line-height:1.35;color:#c9d0db;margin:8px 0 0}
.big-number{font:900 78px/1 Arial,sans-serif;color:var(--gold2);text-shadow:0 4px 0 #503200;margin:6px 0}
.big-number.small{font-size:58px}
.pass-icon{font:900 48px/1 Arial,sans-serif;color:#af9aff;margin-bottom:9px}
.pass-card h2{font-size:28px;color:#ffda53;margin:4px 0 2px}
.status-strip{height:18px;min-height:18px;display:flex;align-items:center;justify-content:space-around;gap:2px;background:rgba(8,15,27,.92);border-bottom:1px solid #27384e;color:#8e9aac;font:700 7px Arial,sans-serif}
.status-strip b{color:#f6d04b;font-size:8px}
.dossier-card{margin:6px 8px 2px;min-height:200px;flex:1 1 auto;overflow:hidden;border:1px solid rgba(230,127,0,.58);border-radius:10px;padding:9px 10px;background:rgba(11,21,37,.96);box-shadow:0 7px 19px rgba(0,0,0,.32)}
.dossier-card h2{font-size:17px;line-height:1.02;color:#ffd13d;margin:5px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dossier-card p{margin:0;font-size:13.6px;line-height:1.34;color:#e1e5eb;overflow-wrap:anywhere}

/* Consultation */
.consult-title{height:48px;min-height:48px;padding:7px 10px 3px}
.consult-title h2{margin:2px 0 0;font-size:19px;color:#fff}
.consult-title+.menu-list .menu-row{height:34px;min-height:34px;padding-top:4px;padding-bottom:4px}
.consult-title+.menu-list .menu-row b{font-size:8.5px}.consult-title+.menu-list .menu-row small{font-size:7.4px}

/* Theory deck */
.card-screen{background:linear-gradient(rgba(5,10,19,.80),rgba(6,12,22,.94)),url('../assets/images/bg_case_board.png') center/cover no-repeat}
.theory-card{position:relative;margin:5px 9px 2px;height:216px;min-height:216px;border:2px solid #72819a;border-radius:12px;padding:8px;background:linear-gradient(180deg,#172238,#0a1221);box-shadow:0 5px 0 #02050b,0 12px 26px rgba(0,0,0,.45);overflow:hidden}
.theory-card:after{content:"";position:absolute;inset:auto -33px -62px auto;width:135px;height:135px;background:url('../assets/images/item_theory_card_back.png') center/cover;border-radius:50%;opacity:.055;transform:rotate(12deg);pointer-events:none}
.theory-card.selected{box-shadow:0 0 0 2px #ffe978,0 5px 0 #5e3e00,0 12px 28px rgba(0,0,0,.48)}
.card-ribbon{height:18px;display:flex;justify-content:space-between;align-items:center;gap:5px;padding:0 5px;border-radius:5px;background:rgba(4,9,17,.48);border:1px solid rgba(255,255,255,.12);font:900 7px Arial,sans-serif;letter-spacing:.045em;text-transform:uppercase}
.card-ribbon span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-ribbon b{color:#ffe16c;white-space:nowrap}
.card-heading{display:flex;align-items:center;gap:7px;margin:7px 1px 4px}
.card-heading img{width:35px;height:35px;object-fit:cover;border-radius:50%;border:1px solid rgba(255,255,255,.45);box-shadow:0 2px 7px rgba(0,0,0,.45)}
.card-heading h2{font-size:16px;line-height:1.0;margin:0;color:#fff;max-height:34px;overflow:hidden}
.card-heading em{display:block;margin-top:2px;color:#e7dcae;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:157px}
.card-concept{font-size:11px;line-height:1.25;color:#e2e6ec;margin:4px 1px 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-purpose{position:relative;z-index:1;border:1px solid rgba(255,220,89,.28);background:rgba(28,22,5,.36);border-radius:6px;padding:5px 6px;min-height:56px}
.card-purpose b{display:block;color:#ffe174;font:900 7px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.card-purpose span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#eee9dc;font-size:9.5px;line-height:1.25;margin-top:2px}
.card-stats{position:absolute;z-index:2;left:9px;right:9px;bottom:6px;display:flex;justify-content:space-between;color:#aeb8c8;font:800 7px Arial,sans-serif;letter-spacing:.03em}
.utility-card{margin:19px 12px 5px;height:190px;border:2px solid #56647b;border-radius:13px;padding:14px;text-align:center;background:linear-gradient(180deg,#15233a,#0a1221);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 0 #02050b,0 14px 26px rgba(0,0,0,.4)}
.utility-card h2{margin:6px 0;color:#ffda53;font-size:25px}.utility-card p{margin:5px 0;color:#cbd3de;font-size:11px;line-height:1.3;max-height:58px;overflow:hidden}.focus-big{font:900 40px/1 Arial,sans-serif;color:#54dfec;margin:3px}.focus-big small{font-size:9px;color:#9eabba}.utility-card.redraw{border-color:#60718f}.utility-card.intervention{border-color:#29bd92}.utility-card.wild{border-color:#8f6af0}

/* Discipline colour language preserved from Theory Lab */
.theory-card.psychology,.detail-card.psychology{border-color:#22c7ad;background:linear-gradient(180deg,#10453e,#0a1e21)}
.theory-card.sociology,.detail-card.sociology{border-color:#e2a62f;background:linear-gradient(180deg,#4a3210,#23170a)}
.theory-card.nursing,.detail-card.nursing{border-color:#48ce77;background:linear-gradient(180deg,#15442b,#0a2016)}
.theory-card.social-work,.detail-card.social-work{border-color:#9a74ef;background:linear-gradient(180deg,#38285e,#1b1733)}
.theory-card.public-health,.detail-card.public-health{border-color:#28c6de;background:linear-gradient(180deg,#123f53,#0b2032)}
.theory-card.disability,.detail-card.disability{border-color:#e6ca36;background:linear-gradient(180deg,#4a3d11,#241d08)}
.theory-card.communication,.detail-card.communication{border-color:#49b7ee;background:linear-gradient(180deg,#163a5d,#111d3e)}
.theory-card.systems,.detail-card.systems{border-color:#757ae8;background:linear-gradient(180deg,#252d60,#12182f)}
.theory-card.ethics,.detail-card.ethics{border-color:#ec698c;background:linear-gradient(180deg,#53213a,#29101f)}
.theory-card.education,.detail-card.education{border-color:#8fc84e;background:linear-gradient(180deg,#30471a,#142414)}

/* Details */
.detail-card{margin:12px 10px 4px;height:198px;border:2px solid #576985;border-radius:12px;padding:12px;background:linear-gradient(180deg,#152238,#091321);box-shadow:0 6px 0 #02050b,0 13px 28px rgba(0,0,0,.43);display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden}
.detail-card h2{font-size:21px;line-height:1.03;margin:7px 0;color:#ffdb59}
.detail-card p{font-size:12.3px;line-height:1.32;margin:4px 0;color:#e0e5ec;overflow-wrap:anywhere;overflow:hidden}
.detail-name{margin-top:auto;padding-top:5px;border-top:1px solid rgba(255,255,255,.15);color:#9fabbc;font:800 8px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-card.green{border-color:#2bc396;background:linear-gradient(180deg,#123c34,#0a211e)}.detail-card.purple{border-color:#8e6bf0;background:linear-gradient(180deg,#322458,#17142d)}.detail-card.gold{border-color:#e6a82b;background:linear-gradient(180deg,#3f2d0f,#17120a)}

/* Intervention / joker */
.action-card{position:relative;margin:7px 10px 3px;height:211px;border:2px solid #2cc39a;border-radius:12px;padding:10px;background:linear-gradient(180deg,#12463d 0 52%,#0a2725 52%);box-shadow:0 5px 0 #03110d,0 12px 25px rgba(0,0,0,.42);overflow:hidden}
.action-card.wild{border-color:#8e6bf0;background:linear-gradient(180deg,#35265f 0 52%,#1b1734 52%)}
.action-card.selected{box-shadow:0 0 0 2px #ffea79,0 5px 0 #4e3600,0 12px 25px rgba(0,0,0,.45)}
.action-badge{display:inline-block;border:1px solid rgba(255,255,255,.28);border-radius:5px;padding:3px 5px;background:rgba(5,15,14,.45);color:#a6f0d9;font:900 7px Arial,sans-serif;letter-spacing:.07em}
.action-card.wild .action-badge{color:#d9ceff}.action-card h2{font-size:20px;line-height:1.02;margin:7px 0;color:#fff;max-height:42px;overflow:hidden}.action-card p{font-size:11px;line-height:1.28;margin:0 0 8px;color:#dce4e5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.action-card .strapline{color:#d8cbff;font-style:italic}
.practice-box{border:1px solid rgba(255,255,255,.14);background:rgba(4,10,12,.31);border-radius:6px;padding:6px;color:#dbe6e4;font-size:9.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.token-line{position:absolute;left:10px;right:10px;bottom:7px;color:#8ff0d0;font:900 7px Arial,sans-serif;letter-spacing:.05em}.wild .token-line{color:#d2c3ff}.joker-star{position:absolute;right:9px;top:8px;color:#d8c6ff;font:900 28px/1 Arial,sans-serif;transform:rotate(8deg)}

/* Review / outcomes */
.review-card{margin:7px 9px 4px;height:162px;border:1px solid #78601f;border-radius:10px;background:rgba(10,19,33,.96);padding:9px;overflow:hidden}
.mini-stack{display:grid;gap:3px;margin:6px 0}.mini-stack span{display:block;border-left:3px solid #71809a;background:#141f33;border-radius:4px;padding:4px 6px;color:#e8ebef;font:800 7.5px Arial,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mini-stack span.psychology{border-color:#22c7ad}.mini-stack span.sociology{border-color:#e2a62f}.mini-stack span.nursing{border-color:#48ce77}.mini-stack span.social-work{border-color:#9a74ef}.mini-stack span.public-health{border-color:#28c6de}.mini-stack span.disability{border-color:#e6ca36}.mini-stack span.communication{border-color:#49b7ee}.mini-stack span.systems{border-color:#757ae8}.mini-stack span.ethics{border-color:#ec698c}.mini-stack span.education{border-color:#8fc84e}
.review-line{display:grid;grid-template-columns:42px 1fr;gap:5px;margin-top:4px;border-top:1px solid #2b3a50;padding-top:4px;font:700 7px Arial,sans-serif}.review-line b{color:#53dfe9}.review-line span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#cbd4e1}
.two-actions{display:grid;gap:4px;margin:0 9px 4px}.two-actions .menu-row{height:28px;min-height:28px;text-align:center;align-items:center;padding:4px}
.outcome-card{margin:7px 9px 4px;height:180px;border:2px solid #64728a;border-radius:11px;background:linear-gradient(180deg,#152238,#091321);padding:11px;overflow:hidden;box-shadow:0 6px 0 #02050b}.outcome-card.good{border-color:#2fc99b}.outcome-card.mixed{border-color:#e7ac31}.outcome-card.poor{border-color:#d85a61}.outcome-card h2{font-size:19px;margin:6px 0;color:#ffdb58;line-height:1.03}.outcome-card p{font-size:12px;line-height:1.32;margin:0;color:#e0e5ec;overflow:hidden}.end-stamp{position:absolute;right:16px;bottom:37px;transform:rotate(-4deg);border:2px solid #48d7a6;color:#8ff0d0;padding:4px 6px;border-radius:5px;font:900 8px Arial,sans-serif;letter-spacing:.08em}.end-stamp.lose{border-color:#e85f66;color:#ff9da2}
.score-card{margin:7px 9px 4px;min-height:169px;max-height:185px;border:1px solid #6c5721;border-radius:11px;background:rgba(10,19,33,.97);padding:10px;overflow:hidden}.score-card h2{font-size:18px;margin:5px 0;color:#ffda54}.score-card>p{font-size:10.5px;line-height:1.28;color:#d4dbe4;margin:3px 0}.final-score{text-align:center;margin:4px}.final-score b{display:block;font:900 38px/1 Arial,sans-serif;color:#54dfea}.final-score span{font:800 7px Arial,sans-serif;color:#91a0b4;letter-spacing:.08em}.result-grid{display:flex;justify-content:center;gap:7px;margin-top:5px}.result-grid span{border:1px solid #37475f;border-radius:5px;padding:4px 6px;background:#111d30;color:#cbd4df;font:800 7px Arial,sans-serif}.score-row{border-top:1px solid #2e3c51;padding:5px 0;font-family:Arial,sans-serif}.score-row b{display:block;color:#ffe16b;font-size:8px}.score-row span{display:block;color:#aeb9c8;font-size:7px;margin-top:1px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* v3.2 r1 readability update: vertical wheel deck */
.vertical-deck-screen{overflow:hidden}
.deck-window{position:relative;flex:1 1 auto;height:234px;overflow:hidden;padding:7px 8px 6px;background:linear-gradient(180deg,rgba(6,12,22,.30),rgba(3,8,15,.58))}
.deck-track{display:grid;gap:6px;transition:transform .16s cubic-bezier(.2,.8,.2,1);will-change:transform;padding-bottom:82px}
.deck-tile{position:relative;height:67px;min-height:67px;border:1px solid #42536e;border-radius:9px;padding:6px 27px 6px 8px;background:linear-gradient(180deg,#152238,#0b1424);box-shadow:0 3px 0 rgba(0,0,0,.48),0 7px 16px rgba(0,0,0,.26);opacity:.62;transform:scale(.965);transform-origin:center;transition:opacity .13s ease,transform .13s ease,border-color .13s ease,box-shadow .13s ease}
.deck-tile.active{opacity:1;transform:translateX(3px) scale(1);border-width:2px;box-shadow:0 0 0 1px rgba(255,219,89,.20),0 4px 0 rgba(0,0,0,.55),0 9px 20px rgba(0,0,0,.38)}
.deck-tile.chosen{box-shadow:0 0 0 1px #ffe776,0 4px 0 #4b3500,0 8px 18px rgba(0,0,0,.34)}
.deck-tile .tile-top{display:flex;align-items:center;justify-content:space-between;gap:5px;margin-bottom:3px;font:900 6.5px/1 Arial,sans-serif;letter-spacing:.055em;text-transform:uppercase;color:#c7d0de}
.deck-tile .tile-top span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deck-tile .tile-top b{color:#ffe16c;white-space:nowrap}
.tile-main{min-width:0}.tile-main b{display:block;padding-right:2px;font-size:12px;line-height:1.02;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile-main span{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:3px;color:#cbd3de;font-size:8.8px;line-height:1.15}
.tile-mark{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:900 18px/1 Arial,sans-serif;color:#ffd853}
.tile-kicker{font:900 6.5px/1 Arial,sans-serif;letter-spacing:.08em;color:#f2b927;margin-bottom:4px}.utility-tile{border-color:#6b5931;background:linear-gradient(180deg,#29230f,#11192a)}
.action-tile{height:72px;min-height:72px}.action-tile.green{border-color:#2cc39a;background:linear-gradient(180deg,#113c35,#0a2623)}.action-tile.purple{border-color:#8e6bf0;background:linear-gradient(180deg,#302454,#18162e)}
.deck-focus{display:none}

/* Keep more words visible without making the screen feel cramped */
.dossier-card{padding:8px 9px}.dossier-card h2{font-size:15px;margin:4px 0 5px}.dossier-card p{font-size:11.2px;line-height:1.26}
.case-ticket h2{font-size:18px}.case-sub{font-size:11.2px;line-height:1.25}
.detail-card{margin:8px 9px 3px;height:206px;padding:9px 10px}.detail-card h2{font-size:17px;line-height:1.04;margin:5px 0}.detail-card p{font-size:10.5px;line-height:1.26}
.outcome-card p{font-size:10.7px;line-height:1.27}.score-card>p{font-size:9.7px;line-height:1.23}
.controls{font-size:7.5px}.topbar .brand{font-size:9px}.hud-mini{font-size:7px}


#boot-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#070d18;color:#dfe7f2;font:700 11px/1.35 Arial,sans-serif;text-align:center;z-index:9999}
#boot-fallback small{display:block;margin-top:7px;color:#8fa0b6;font-size:8px;font-weight:600}

</style>

    const clientName = `${firstName} ${surname}`;

    if (systemic)
        cards.push(systemic);
    // Guarantee 1 Disability/Inclusion
    const disability = allStarterOrCore.find((c) => c.id === 'social_model_disability' || c.discipline === 'Disability & Inclusion');
    if (disability)
        cards.push(disability);

    const health = allStarterOrCore.find((c) => c.id === 'biopsychosocial' || c.discipline === 'Nursing');
    if (health)
        cards.push(health);
    // Guarantee 1 Anti-Oppressive/Social Justice
    const socialWork = allStarterOrCore.find((c) => c.id === 'anti_oppressive' || c.tags.includes('Social Justice'));
    if (socialWork)

    // Guarantee 1 Cognitive/Behavioural or Public Health
    const cbtOrPh = allStarterOrCore.find((c) => c.id === 'dahlgren_whitehead' || c.id === 'cbt_beck');
    if (cbtOrPh && !cards.some((c) => c.id === cbtOrPh.id))
        cards.push(cbtOrPh);
    // Guarantee 1 Communication or Needs
    const comm = allStarterOrCore.find((c) => c.id === 'active_listening' || c.id === 'maslow_hierarchy');
    if (comm && !cards.some((c) => c.id === comm.id))
        cards.push(comm);
    // Fill up to 7 cards if needed with random starter/core
    const remaining = allStarterOrCore
        .filter((c) => !cards.some((existing) => existing.id === c.id))
        .sort(() => Math.random() - 0.5);
    while (cards.length < 7 && remaining.length > 0) {
        cards.push(remaining.pop());
    }
    return cards;

/**
 * Simulates a CPU Colleague formulating their case conference proposal in response
 * to the case scenario, matching their theoretical orientation and practitioner capacity.
 */
function simulateCPUColleagueConsultation(colleague, scenario, fullCardPool = ALL_THEORY_CARDS) {
    const maxCap = scenario.practitionerCapacity || 10;
    const maxSlots = scenario.maxFormulationSlots || 4;
    // Score candidate cards based on colleague's preferences and scenario compatibility
    const scoredPool = fullCardPool.map((card) => {
        let weight = 0;
        if (colleague.preferredModalities.includes(card.discipline))
            weight += 30;
        if (card.discipline === colleague.primaryDiscipline)
            weight += 20;
        for (const tag of card.tags) {
            if (colleague.preferredTags.includes(tag))
                weight += 15;
        }
        // Scenario bonus matches
        if (scenario.bonusTag && card.tags.includes(scenario.bonusTag))
            weight += 25;
        if (scenario.secondaryBonusTag && card.tags.includes(scenario.secondaryBonusTag))
            weight += 20;
        // Add small random variation
        weight += Math.random() * 15;
        return { card, weight };
    });
    scoredPool.sort((a, b) => b.weight - a.weight);
    // Greedily pick cards respecting capacity and slot limits
    const chosenCards = [];
    let currentCap = 0;
    for (const item of scoredPool) {
        if (chosenCards.length >= maxSlots)
            break;
        const cost = item.card.capacityCost || 2;
        if (currentCap + cost <= maxCap) {
            chosenCards.push(item.card);
            currentCap += cost;
        }
    }
    // Calculate CPU Score
    const baseInsight = chosenCards.reduce((acc, c) => acc + c.baseInsight, 0);
    const avgMult = chosenCards.reduce((acc, c) => acc + c.baseApplication, 0) / (chosenCards.length || 1);
    const disciplines = new Set(chosenCards.map((c) => c.discipline));
    const diversityBonus = disciplines.size > 1 ? (disciplines.size - 1) * 0.35 : 0;
    // Check synergies for CPU
    const matchedCombos = DISCOVERED_COMBINATIONS.filter((c) => c.customCheck && c.customCheck(chosenCards));
    const comboInsight = matchedCombos.reduce((acc, c) => acc + c.insightBonus, 0);
    const comboMult = matchedCombos.reduce((acc, c) => acc + (c.multiplierBonus - 1.0), 0);
    // Scenario bonus
    let caseInsight = 0;
    let caseMult = 0;
    const allTags = new Set(chosenCards.flatMap((c) => c.tags));
    if (scenario.bonusTag && allTags.has(scenario.bonusTag)) {
        caseInsight += 30;
        caseMult += 0.35;
    }
    if (scenario.secondaryBonusTag && allTags.has(scenario.secondaryBonusTag)) {
        caseInsight += 25;
        caseMult += 0.25;
    }
    const totalInsight = Math.round(baseInsight + comboInsight + caseInsight);
    const totalMultiplier = Number((avgMult + diversityBonus + comboMult + caseMult).toFixed(2));
    const totalScore = Math.round(totalInsight * totalMultiplier);
    const synergyName = matchedCombos.length > 0 ? matchedCombos[0].name : `${colleague.name}'s ${colleague.primaryDiscipline} Stance`;
    // Create reasoning log
    const clientFirst = scenario.clientName.split(' ')[0];
    const reasoningLog = `${colleague.name} prioritises ${chosenCards.map((c) => c.title).join(', ')}. In their clinical notes, they argue: "${colleague.philosophy} For ${clientFirst}, our foremost priority is addressing their ${scenario.sector.toLowerCase()} crisis through rigorous ${colleague.primaryDiscipline} framing."`;
    const peerReviewFeedback = totalScore >= scenario.targetScore
        ? `Strong peer formulation from ${colleague.name}! Their ${synergyName} approach secured ${totalScore.toLocaleString()} Insight Points, effectively addressing the case requirements.`
        : `${colleague.name}'s formulation achieved ${totalScore.toLocaleString()} Insight Points. While theoretically coherent, their specific focus missed some of ${clientFirst}'s wider systemic or relational nuances.`;
    return {
        colleague,
        selectedCards: chosenCards,
        usedCapacity: currentCap,
        totalInsight,
        totalMultiplier,
        totalScore,
        synergyName,
        reasoningLog,
        peerReviewFeedback,
    };
}

    // 2. Theory-by-theory breakdown
    const appliedTheoriesAnalysis = selectedCards.map((card) => {
        let howItWorksWithClient = `Applies ${card.title} by holding ${clientName}'s subjective experience with dignity, addressing their ${scenario.sector.toLowerCase()} needs.`;
        if (card.discipline === 'Psychology') {
            howItWorksWithClient = `Provides an emotional and cognitive container for ${clientName}, helping alleviate their ${scenario.emotionalVulnerability?.toLowerCase() || 'internal emotional distress'} without imposing premature demands.`;
        }
        else if (card.discipline === 'Sociology' || card.discipline === 'Social Work') {
            howItWorksWithClient = `Identifies and challenges the institutional power imbalances and barriers that leave ${clientName} feeling isolated or unheard in the ${scenario.sector}.`;
        }
        else if (card.discipline === 'Nursing' || card.discipline === 'Public Health') {
            howItWorksWithClient = `Bridges somatic well-being and daily living with the social determinants impacting ${clientName}'s physical stamina and living conditions.`;
        }
        else if (card.discipline === 'Disability & Inclusion') {
            howItWorksWithClient = `Reframes ${clientName}'s challenges away from personal deficit toward environmental and sensory accommodations that preserve their dignity.`;
        }
        else if (card.discipline === 'Ethics & Human Rights') {
            howItWorksWithClient = `Anchors the casework in fundamental human rights, safeguarding ${clientName}'s autonomy and legal entitlement to least restrictive care.`;
        }
        const suggestedDialogue = card.practitionerQuestions[0] || `What feels most important for us to explore together today, ${clientName}?`;
        return {
            card,
            howItWorksWithClient,
            suggestedDialogue,
            relationalStance: card.relationalStance,
            clinicalPitfall: card.pitfalls,
        };
    });
    // 3. Missed Opportunities / Alternative Lenses reflection
    const disciplinesPresent = new Set(selectedCards.map((c) => c.discipline));
    const missedOpportunities = [];
    if (!disciplinesPresent.has('Sociology') && !disciplinesPresent.has('Social Work')) {
        missedOpportunities.push(`Structural / Social Lens: While internal psychological attunement was strong, incorporating Anti-Oppressive Practice or Social Determinants could further address the systemic barriers and institutional friction ${clientName} faces.`);
    }
    if (!disciplinesPresent.has('Disability & Inclusion') && (scenario.bonusTag === 'Sensory' || scenario.secondaryBonusTag === 'Neurodiversity' || scenario.bonusTag === 'Barriers')) {
        missedOpportunities.push(`Disability & Accessibility Lens: The case hints at significant environmental or sensory barriers; integrating the Social Model of Disability would ensure physical and procedural adjustments are prioritised.`);
    }
    if (!disciplinesPresent.has('Psychology') && (scenario.bonusTag === 'Relational' || scenario.bonusTag === 'Trauma')) {
        missedOpportunities.push(`Relational / Somatic Lens: Adding Trauma-Informed Practice or Polyvagal Theory would provide vital grounding for ${clientName}'s hypervigilant nervous system.`);
    }
    if (missedOpportunities.length === 0) {
        missedOpportunities.push(`Exemplary Balance: Your formulation touched across multiple complementary dimensions, leaving few blind spots in ${clientName}'s casework plan.`);
    }
    // 4. Key learning takeaways
    const keyLearningTakeaways = [
        `People are whole lifeworlds: Combining ${selectedCards.length} distinct theories prevented one-dimensional reductionism.`,
        `Managing capacity: Applying theories thoughtfully within practitioner focus boundaries ensures clinical depth over superficial breadth.`,
        `Relational pacing: Every theoretical framework is only as effective as the authentic empathy and trust between practitioner and person.`,
    ];
    // 5. APA 7th References and in-text citations for this consultation
    const apaReferences = Array.from(new Set(selectedCards.map((c) => c.apa7Reference))).sort();
    const inTextCitations = selectedCards.map((c) => c.inTextCitation);
    return {
        synthesisTitle,
        synthesisNarrative,
        formulationGrade,
        gradeDescription,
        appliedTheoriesAnalysis,
        missedOpportunities,
        keyLearningTakeaways,
        apaReferences,
        inTextCitations,
        cpuComparison: cpuResult || null,
    };
}
/**
 * Generates a full APA 7th reference list text for all theories in the compendium,
 * alphabetised by lead author's surname.
 */
function getAlphabetisedAPABibliography() {
    return [...ALL_THEORY_CARDS].map((card) => {
        // Extract first author surname for APA alphabetical sorting
        const authorSortKey = card.apa7Reference.split(' ')[0].replace(/,/g, '');
        return { card, authorSortKey };
    }).sort((a, b) => a.authorSortKey.localeCompare(b.authorSortKey));
}
/**
 * Formats a clean, ready-to-export Case Study Formulation and APA 7th Bibliography document.
 */
function generateFormulationExportDocument(scenario, selectedCards, achievedScore, debriefData) {
    const dateStr = new Date().toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'long',
        year: 'numeric',
    });
    const lines = [];
    lines.push('================================================================================');
    lines.push('CASEWORK FORMULATION & ACADEMIC REFERENCE DOSSIER (APA 7th EDITION)');
    lines.push('================================================================================');
    lines.push(`Date of Formulation: ${dateStr}`);
    lines.push(`Case Study: ${scenario.title} (${scenario.subtitle})`);
    lines.push(`Client: ${scenario.clientName} (Age: ${scenario.clientAge})`);
    lines.push(`Practice Sector: ${scenario.sector}`);
    lines.push(`Complexity Tier: ${scenario.complexityTier}`);
    lines.push(`Formulation Grade: ${debriefData.formulationGrade} (${debriefData.gradeDescription})`);
    lines.push(`Achieved Insight Score: ${achievedScore.toLocaleString()} Points (Target: ${scenario.targetScore.toLocaleString()})`);
    lines.push('');
    lines.push('--------------------------------------------------------------------------------');
    lines.push('1. CLINICAL CASE NARRATIVE & CONTEXT');
    lines.push('--------------------------------------------------------------------------------');
    lines.push(scenario.scenario);
    if (scenario.backgroundSummary) {
        lines.push(`\nBackground & Lived Experience: ${scenario.backgroundSummary}`);
    }
    if (scenario.unspokenVulnerabilities) {
        lines.push(`Unspoken Vulnerabilities & Silent Fears: ${scenario.unspokenVulnerabilities}`);
    }
    if (scenario.institutionalBarriers) {
        lines.push(`Institutional & Structural Barriers: ${scenario.institutionalBarriers}`);
    }
    lines.push('');
    lines.push('--------------------------------------------------------------------------------');
    lines.push('2. THEORETICAL SYNTHESIS & APPLIED FRAMEWORKS');
    lines.push('--------------------------------------------------------------------------------');
    lines.push(`Synthesis Modality: ${debriefData.synthesisTitle}`);
    lines.push(`Clinical Formulation Narrative:`);
    lines.push(debriefData.synthesisNarrative);
    lines.push('');
    lines.push('Selected Theoretical Lenses (In-Text Citations):');
    selectedCards.forEach((c) => {
        lines.push(`• ${c.title} ${c.inTextCitation} — [${c.discipline} | Focus Cost: ${c.capacityCost} Capacity Pts]`);
    });
    lines.push('');
    lines.push('Applied Interventions & Clinical Dialogue Prompts:');
    debriefData.appliedTheoriesAnalysis.forEach(({ card, howItWorksWithClient, suggestedDialogue, relationalStance, clinicalPitfall }) => {
        lines.push(`\n[ ${card.title} ${card.inTextCitation} ]`);
        lines.push(`  - Mode of Operation: ${howItWorksWithClient}`);
        lines.push(`  - Actionable Dialogue: "${suggestedDialogue}"`);
        lines.push(`  - Relational Stance: ${relationalStance}`);
        lines.push(`  - Clinical Pitfall to Avoid: ${clinicalPitfall}`);
    });
    if (debriefData.cpuComparison) {
        const cpu = debriefData.cpuComparison;
        lines.push('');
        lines.push('--------------------------------------------------------------------------------');
        lines.push(`CASE CONFERENCE PEER COMPARISON (${cpu.colleague.name.toUpperCase()})`);
        lines.push('--------------------------------------------------------------------------------');
        lines.push(`Colleague: ${cpu.colleague.title}`);
        lines.push(`Orientation: ${cpu.colleague.philosophy}`);
        lines.push(`Colleague's Proposed Formulation: ${cpu.selectedCards.map((c) => c.title).join(', ')}`);
        lines.push(`Colleague Score: ${cpu.totalScore.toLocaleString()} Points`);
        lines.push(`Peer Review: ${cpu.peerReviewFeedback}`);
    }
    lines.push('');
    lines.push('--------------------------------------------------------------------------------');
    lines.push('3. REFLECTIVE CRITIQUE & PEDAGOGICAL TAKEAWAYS');
    lines.push('--------------------------------------------------------------------------------');
    lines.push('Alternative Lenses to Consider:');
    debriefData.missedOpportunities.forEach((opp) => lines.push(`  * ${opp}`));
    lines.push('\nCore Learning Takeaways:');
    debriefData.keyLearningTakeaways.forEach((takeaway) => lines.push(`  ✓ ${takeaway}`));
    lines.push('');
    lines.push('--------------------------------------------------------------------------------');
    lines.push('4. FORMAL APA 7th EDITION REFERENCE LIST');
    lines.push('--------------------------------------------------------------------------------');
    debriefData.apaReferences.forEach((ref) => {
        lines.push(ref);
        lines.push('');
    });
    lines.push('================================================================================');
    lines.push('Generated via Theory Lab: Critical Synthesis & Human-Centred Casework');
    lines.push('================================================================================');
    return lines.join('\n');
}

const R1Bridge = window.R1Bridge = (() => {
  const listeners = { up: [], down: [], click: [], long: [] };
  const KEY = 'theory_lab_r1_v31';

  const encode = (value) => {
    const json = JSON.stringify(value);
    return btoa(unescape(encodeURIComponent(json)));
  };
  const decode = (value) => JSON.parse(decodeURIComponent(escape(atob(value))));

  async function save(value) {
    try {
      if (window.creationStorage?.plain?.setItem) {
        await window.creationStorage.plain.setItem(KEY, encode(value));
      } else {
        localStorage.setItem(KEY, JSON.stringify(value));
      }
      return true;
    } catch (error) {
      console.warn('Theory Lab save failed', error);
      return false;
    }
  }

  async function load() {
    try {
      if (window.creationStorage?.plain?.getItem) {
        const raw = await window.creationStorage.plain.getItem(KEY);
        return raw ? decode(raw) : null;
      }
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) {
      console.warn('Theory Lab load failed', error);
      return null;
    }
  }

  async function clear() {
    try {
      if (window.creationStorage?.plain?.removeItem) {
        await window.creationStorage.plain.removeItem(KEY);
      } else {
        localStorage.removeItem(KEY);
      }
    } catch (error) {
      console.warn('Theory Lab clear failed', error);
    }
  }

  function emit(type) {
    (listeners[type] || []).forEach(fn => fn());
  }
  function on(type, fn) {
    listeners[type].push(fn);
  }

  window.addEventListener('scrollUp', () => emit('up'));
  window.addEventListener('scrollDown', () => emit('down'));
  window.addEventListener('sideClick', () => emit('click'));
  window.addEventListener('longPressStart', () => emit('long'));

  // Desktop / phone fallbacks for development.
  window.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') emit('up');
    if (event.key === 'ArrowDown' || event.key === 'ArrowRight') emit('down');
    if (event.key === 'Enter' || event.key === ' ') emit('click');
    if (event.key.toLowerCase() === 'h') emit('long');
  });

  let touchY = null;
  let touchAt = 0;
  window.addEventListener('touchstart', (event) => {
    touchY = event.touches[0]?.clientY ?? null;
    touchAt = Date.now();
  }, { passive: true });
  window.addEventListener('touchend', (event) => {
    if (touchY === null) return;
    const endY = event.changedTouches[0]?.clientY ?? touchY;
    const dy = endY - touchY;
    const duration = Date.now() - touchAt;
    if (duration > 650) emit('long');
    else if (Math.abs(dy) > 26) emit(dy > 0 ? 'up' : 'down');
    else emit('click');
    touchY = null;
  }, { passive: true });

  return {
    onUp: fn => on('up', fn),
    onDown: fn => on('down', fn),
    onClick: fn => on('click', fn),
    onLong: fn => on('long', fn),
    save,
    load,
    clear,
    isR1: () => !!window.creationStorage || typeof window.PluginMessageHandler !== 'undefined'
  };
})();

function shuffle(arr) {
  const out = [...arr];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

const THEORY_PURPOSE_RULES = [
  { tags:['Person-Centred','Empathy','Humanistic'], label:'Voice & meaning', reveal:'Brings the person’s priorities, meaning and own account into the formulation.', special:'VOICE FIRST', progress:1, trust:2 },
  { tags:['Systems','Ecological','Structural','Social Determinants','Context'], label:'Systems & context', reveal:'Looks beyond the presenting problem to services, housing, money, policy, relationships and environmental pressures.', special:'WIDEN THE FRAME', progress:2, trust:0 },
  { tags:['Disability','Inclusion','Barriers','Neurodiversity'], label:'Barriers & adjustments', reveal:'Tests whether distress or exclusion is being produced by inaccessible environments, expectations or communication.', special:'REMOVE THE BARRIER', progress:2, trust:1 },
  { tags:['Communication','Language','Accessibility'], label:'Communication access', reveal:'Checks what has actually been understood, expressed and made accessible rather than assuming capacity or engagement.', special:'MAKE IT UNDERSTANDABLE', progress:1, trust:2 },
  { tags:['Trauma','Attachment','Relational','Compassion','Safety'], label:'Safety & relationships', reveal:'Explores how safety, previous experiences and relationships may shape present responses without reducing everything to trauma.', special:'SAFETY BEFORE DEMAND', progress:1, trust:2 },
  { tags:['Human Rights','Autonomy','Advocacy','Co-production','Power','Social Justice'], label:'Rights & power', reveal:'Makes power, choice, rights and whose voice carries most weight visible in the case.', special:'SHIFT THE POWER', progress:1, trust:2 },
  { tags:['Biological','Health','Somatic','Physical Health','Nursing'], label:'Health & body', reveal:'Keeps physical health, medication, pain, sleep and bodily changes in view alongside psychological and social explanations.', special:'DO NOT DIAGNOSTICALLY OVERSHADOW', progress:2, trust:0 },
  { tags:['Cognitive','Behavioural','Motivation','Learning'], label:'Patterns & learning', reveal:'Looks for patterns between thoughts, behaviour, reinforcement, expectations and the situations in which they occur.', special:'TEST THE PATTERN', progress:2, trust:0 },
  { tags:['Strengths','Strengths-Based','Capabilities','Narrative','Agency','Recovery'], label:'Strengths & possibility', reveal:'Identifies abilities, relationships, preferred identities and existing ways of coping that a deficit account may overlook.', special:'BUILD FROM WHAT WORKS', progress:1, trust:2 },
];

function purposeForCard(card) {
  const tags = card.tags || [];
  const rule = THEORY_PURPOSE_RULES.find(r => r.tags.some(tag => tags.includes(tag))) || {
    label: card.discipline || 'Practice lens',
    reveal: card.strength || card.concept || 'Offers another way to understand the person’s situation.',
    special: 'CHANGE THE ANGLE', progress:1, trust:0,
  };
  return {
    ...rule,
    practice: card.practicalApplication || card.strength || card.concept || '',
    watch: card.limitation || card.pitfalls || 'Use alongside other perspectives and the person’s own account.'
  };
}

function createPlayer(index) {
  const ids = shuffle(ALL_THEORY_CARDS.map(c => c.id));
  return {
    id: `p${index + 1}`,
    name: `Player ${index + 1}`,
    turn: 1,
    maxTurns: MAX_TURNS,
    progress: 0,
    trust: 50,
    score: 0,
    status: 'playing',
    handIds: ids.splice(0, HAND_SIZE),
    drawIds: ids,
    discardIds: [],
    selectedTheoryIds: [],
    selectedInterventionId: null,
    interventionToken: true,
    selectedWildId: null,
    wildUsed: false,
    wildOptions: shuffle(PROFESSIONAL_WILDS).slice(0, 4).map(w => w.id),
    redraws: 2,
    storyLog: [],
    reactionIds: [],
    outcomeReason: ''
  };
}

function focusUsed(player = getPlayer()) {
  return (player?.selectedTheoryIds || []).reduce((sum, id) => sum + (byId(ALL_THEORY_CARDS, id)?.capacityCost || 2), 0);
}

function snapshot() {
  return {
    version: 2,
    mode: state.mode,
    caseIndex: state.caseIndex,
    casePage: state.casePage,
    proceduralIndex: state.proceduralIndex,
    activeScenario: state.activeScenario,
    playerCount: state.playerCount,
    players: state.players,
    activePlayerIndex: state.activePlayerIndex,
    screen: ['theoryDetail','detail','help'].includes(state.screen) ? 'consult' : state.screen,
    cursor: 0,
    resultPage: state.resultPage,
    turnResult: state.turnResult,
  };
}

async function persist() {
  if (!state.players.length) return;
  await R1Bridge.save(snapshot());
  state.savedSession = snapshot();
}

function restoreSession(saved) {
  if (!saved?.players?.length) return false;
  state.mode = saved.mode || 'STORY';
  state.caseIndex = saved.caseIndex || 0;
  state.casePage = saved.casePage || 0;
  state.proceduralIndex = saved.proceduralIndex || 1;
  state.activeScenario = saved.activeScenario || null;
  state.playerCount = saved.playerCount || 2;
  state.players = saved.players;
  state.activePlayerIndex = saved.activePlayerIndex || 0;
  state.screen = saved.screen || 'case';
  state.cursor = 0;
  state.resultPage = saved.resultPage || 0;
  state.turnResult = saved.turnResult || null;
  state.detail = null;
  state.toast = null;
  return true;
}

function startGame() {
  if (state.mode === 'ENDLESS') {
    state.activeScenario = generateProceduralCase(state.proceduralIndex, 1 + Math.max(0, state.proceduralIndex - 1) * 0.05);
  } else {
    state.activeScenario = null;
  }
  const count = state.mode === 'PASS' ? state.playerCount : 1;
  state.players = Array.from({ length: count }, (_, i) => createPlayer(i));
  state.activePlayerIndex = 0;
  state.casePage = 0;
  state.turnResult = null;
  state.resultPage = 0;
  state.cursor = 0;
  state.screen = state.mode === 'PASS' ? 'pass' : 'case';
  render();
  persist();
}

function restartCurrentCase() {
  const count = state.mode === 'PASS' ? state.playerCount : 1;
  state.players = Array.from({ length: count }, (_, i) => createPlayer(i));
  state.activePlayerIndex = 0;
  state.casePage = 0;
  state.turnResult = null;
  state.resultPage = 0;
  state.cursor = 0;
  state.screen = state.mode === 'PASS' ? 'pass' : 'case';
  render();
  persist();
}

function nextEndlessCase() {
  state.proceduralIndex += 1;
  state.activeScenario = generateProceduralCase(state.proceduralIndex, 1 + Math.max(0, state.proceduralIndex - 1) * 0.05);
  restartCurrentCase();
}

function drawReplacementCards(player, count) {
  let needed = count;
  while (needed > 0) {
    if (player.drawIds.length === 0) {
      if (player.discardIds.length === 0) break;
      player.drawIds = shuffle(player.discardIds);
      player.discardIds = [];
    }
    const next = player.drawIds.shift();
    if (!next) break;
    if (!player.handIds.includes(next)) {
      player.handIds.push(next);
      needed -= 1;
    }
  }
}

function refreshHand() {
  const p = getPlayer();
  if (!p || p.redraws <= 0) return toast('No redraws left');
  p.discardIds.push(...p.handIds);
  p.handIds = [];
  drawReplacementCards(p, HAND_SIZE);
  p.redraws -= 1;
  p.selectedTheoryIds = [];
  state.cursor = 0;
  toast(`New hand · ${p.redraws} redraw${p.redraws === 1 ? '' : 's'} left`);
  persist();
}

function selectedTags(theories, intervention, wild) {
  return new Set([
    ...theories.flatMap(c => c.tags || []),
    ...(intervention?.tags || []),
    ...(wild?.tags || []),
  ]);
}

function scoreTurn(player, scenario) {
  const theories = player.selectedTheoryIds.map(id => byId(ALL_THEORY_CARDS, id)).filter(Boolean);
  const intervention = byId(INTERVENTION_CARDS, player.selectedInterventionId);
  const wild = byId(PROFESSIONAL_WILDS, player.selectedWildId);
  const tags = selectedTags(theories, intervention, wild);
  const disciplines = new Set(theories.map(c => c.discipline));
  const theoryPurposes = theories.map(card => ({ card, purpose: purposeForCard(card) }));

  let gain = theories.reduce((sum, card) => sum + 3 + Math.round((card.baseInsight || 30) / 30), 0);
  let score = theories.reduce((sum, card) => sum + Math.round((card.baseInsight || 20) * (card.baseApplication || 1)), 0);

  let directFits = 0;
  theories.forEach(card => {
    if ((scenario.primaryTheoryFits || []).includes(card.title)) {
      gain += 5; score += 70; directFits += 1;
    }
  });
  if (disciplines.size > 1) {
    gain += Math.min(5, (disciplines.size - 1) * 2);
    score += (disciplines.size - 1) * 35;
  }

  let bonusMatches = 0;
  if (scenario.bonusTag && tags.has(scenario.bonusTag)) { gain += 6; score += 90; bonusMatches += 1; }
  if (scenario.secondaryBonusTag && tags.has(scenario.secondaryBonusTag)) { gain += 4; score += 60; bonusMatches += 1; }

  let interventionText = '';
  if (intervention) {
    const relevance = intervention.tags.filter(t =>
      t === scenario.bonusTag || t === scenario.secondaryBonusTag ||
      ['Person-Centred','Relational','Systems','Communication','Autonomy','Social Justice','Integrative'].includes(t)
    ).length;
    gain += 4 + Math.min(5, relevance * 2);
    score += 55 + relevance * 25;
    if (player.interventionToken) interventionText = `${intervention.title} used the free intervention token.`;
    else {
      gain = Math.max(0, gain - 3);
      score = Math.max(0, score - 25);
      interventionText = `${intervention.title} used some limited consultation capacity.`;
    }
  }

  let wildText = '';
  if (wild) {
    const matches = wild.tags.filter(t => t === scenario.bonusTag || t === scenario.secondaryBonusTag).length;
    gain += 5 + matches * 3;
    score += 70 + matches * 35;
    wildText = `${wild.title}: ${wild.effect}`;
  }

  let trustDelta = 0;
  const trustTags = ['Relational','Person-Centred','Communication','Co-production','Cultural Safety','Autonomy','Empathy'];
  trustDelta += Math.min(8, trustTags.filter(t => tags.has(t)).length * 2);
  if (directFits === 0 && bonusMatches === 0) trustDelta -= 5;
  if (theories.length >= 3 && disciplines.size === 1) trustDelta -= 2;
  if (intervention?.tags.includes('Person-Centred')) trustDelta += 2;

  gain += Math.min(5, theoryPurposes.reduce((sum, item) => sum + (item.purpose.progress || 0), 0));
  trustDelta += Math.min(5, theoryPurposes.reduce((sum, item) => sum + (item.purpose.trust || 0), 0));
  gain = Math.max(7, Math.min(33, Math.round(gain)));
  const quality = gain >= 25 ? 'good' : gain >= 17 ? 'mixed' : 'poor';
  return { theories, theoryPurposes, intervention, wild, tags, gain, score: Math.max(50, Math.round(score)), trustDelta, quality, interventionText, wildText, directFits, bonusMatches };
}

function proceduralReactionOptions(scenario) {
  const first = (scenario.clientName || 'The person').split(' ')[0];
  return [
    { id:'proc-voice', tags:['Person-Centred','Empathy','Humanistic','Co-production','Autonomy'], text:`${first} is given more space to shape the conversation. ${scenario.emotionalVulnerability || scenario.unspokenVulnerabilities || ''} What had looked like a professional problem starts to sound different when their own priorities are treated as evidence.` },
    { id:'proc-system', tags:['Systems','Ecological','Structural','Social Determinants','Social Justice'], text:`The formulation widens beyond the individual. ${scenario.environmentalPressure || scenario.institutionalBarriers || ''} This is no longer treated as background context; it becomes part of what the team needs to change.` },
    { id:'proc-access', tags:['Disability','Inclusion','Barriers','Communication','Accessibility','Neurodiversity'], text:`An access issue becomes visible that could easily have been mistaken for disengagement or resistance. ${scenario.institutionalBarriers || scenario.fieldObservations || ''} The next plan begins with removing the barrier rather than correcting the person.` },
    { id:'proc-trauma', tags:['Trauma','Attachment','Relational','Compassion','Safety'], text:`The pace of the conversation changes. ${scenario.unspokenVulnerabilities || scenario.emotionalVulnerability || ''} A response that first looked difficult becomes more understandable when safety, shame and previous experiences are considered.` },
    { id:'proc-health', tags:['Biological','Health','Somatic','Physical Health','Nursing'], text:`Physical health is kept in the formulation rather than being eclipsed by the social or psychological story. ${scenario.fieldObservations || ''} The team agrees that bodily symptoms, medication and daily circumstances need to be considered together.` },
    { id:'proc-strengths', tags:['Strengths','Strengths-Based','Capabilities','Narrative','Agency','Recovery'], text:`The conversation notices more than risk and deficit. ${scenario.backgroundSummary || ''} Existing strengths, relationships and preferred identity begin to shape what a realistic next step could look like.` },
  ];
}

function chooseReaction(player, scenario, result) {
  const reactions = scenario.isProcedural ? proceduralReactionOptions(scenario) : (CASE_REACTIONS[scenario.caseNumber] || []);
  const available = reactions.filter(r => !player.reactionIds.includes(r.id));
  const ranked = available.map(r => ({ r, matches:r.tags.filter(tag => result.tags.has(tag)).length })).sort((a,b) => b.matches - a.matches);
  const selected = ranked.find(x => x.matches > 0)?.r || (scenario.isProcedural ? available[0] : null);
  if (selected) {
    player.reactionIds.push(selected.id);
    return selected.text;
  }
  return GENERIC_REACTIONS[result.quality];
}

function submitTurn() {
  const p = getPlayer();
  const scenario = getCase();
  if (!p?.selectedTheoryIds.length) return toast('Play at least one theory lens first');

  const result = scoreTurn(p, scenario);
  const reaction = chooseReaction(p, scenario, result);
  p.progress = Math.min(TARGET_PROGRESS, p.progress + result.gain);
  p.trust = clamp(p.trust + result.trustDelta, 0, 100);
  p.score += result.score;
  if (result.intervention && p.interventionToken) p.interventionToken = false;
  if (result.wild) p.wildUsed = true;

  p.storyLog.unshift({
    turn: p.turn,
    quality: result.quality,
    text: reaction,
    theories: result.theories.map(c => c.title),
    reveals: result.theoryPurposes.map(item => item.purpose.label),
    intervention: result.intervention?.title || null,
    wild: result.wild?.title || null,
    gain: result.gain,
    trustDelta: result.trustDelta,
  });

  const played = new Set(p.selectedTheoryIds);
  p.handIds = p.handIds.filter(id => !played.has(id));
  p.discardIds.push(...played);
  drawReplacementCards(p, HAND_SIZE - p.handIds.length);

  const turnsRemaining = p.maxTurns - p.turn;
  let outcome = null;
  if (p.progress >= TARGET_PROGRESS) {
    p.status = 'win';
    p.outcomeReason = 'You reached a workable, person-centred formulation and translated it into action.';
    p.score += 500 + turnsRemaining * 75;
    outcome = 'win';
  } else if (p.trust <= 15) {
    p.status = 'lose';
    p.outcomeReason = 'The response became too disconnected from the person’s priorities and trust broke down.';
    outcome = 'lose';
  } else if (p.turn >= p.maxTurns) {
    p.status = 'lose';
    p.outcomeReason = `Six consultations were used and the case remained ${p.progress}/${TARGET_PROGRESS} towards a workable resolution.`;
    outcome = 'lose';
  }

  state.turnResult = {
    quality: result.quality,
    gain: result.gain,
    score: result.score,
    trustDelta: result.trustDelta,
    reaction,
    theories: result.theories.map(c => c.title),
    reveals: result.theoryPurposes.map(item => item.purpose.label),
    intervention: result.intervention?.title || null,
    wild: result.wild?.title || null,
    interventionText: result.interventionText,
    wildText: result.wildText,
    progress: p.progress,
    trust: p.trust,
    turnsRemaining: Math.max(0, turnsRemaining),
    outcome,
  };

  if (p.status === 'playing') p.turn += 1;
  p.selectedTheoryIds = [];
  p.selectedInterventionId = null;
  p.selectedWildId = null;
  state.resultPage = 0;
  state.cursor = 0;
  state.screen = 'outcome';
  render();
  persist();
}

function advanceAfterOutcome() {
  state.turnResult = null;
  const unfinished = state.players.map((p,i) => ({p,i})).filter(x => x.p.status === 'playing');
  if (!unfinished.length) {
    state.screen = 'results'; state.cursor = 0; render(); persist(); return;
  }
  if (state.mode !== 'PASS') {
    state.screen = 'case'; state.casePage = 0; state.cursor = 0; render(); persist(); return;
  }
  for (let step = 1; step <= state.players.length; step++) {
    const candidate = (state.activePlayerIndex + step) % state.players.length;
    if (state.players[candidate].status === 'playing') {
      state.activePlayerIndex = candidate;
      break;
    }
  }
  state.screen = 'pass'; state.cursor = 0; state.casePage = 0; render(); persist();
}

function toggleTheory(id) {
  const p = getPlayer();
  const card = byId(ALL_THEORY_CARDS, id);
  if (!p || !card) return;
  if (p.selectedTheoryIds.includes(id)) {
    p.selectedTheoryIds = p.selectedTheoryIds.filter(x => x !== id);
    toast('Lens removed');
    return;
  }
  if (p.selectedTheoryIds.length >= THEORY_LIMIT) return toast(`Only ${THEORY_LIMIT} theory slots`);
  if (focusUsed(p) + (card.capacityCost || 2) > FOCUS_LIMIT) return toast(`Needs ${card.capacityCost || 2} Focus · ${focusUsed(p)}/${FOCUS_LIMIT} used`);
  p.selectedTheoryIds.push(id);
  toast('Lens added to formulation');
  persist();
}

function splitText(text, max = 205) {
  const words = String(text || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return ['No further information recorded.'];
  const chunks = [];
  let current = '';
  for (const word of words) {
    if ((current + ' ' + word).trim().length > max && current) {
      chunks.push(current);
      current = word;
    } else current = (current + ' ' + word).trim();
  }
  if (current) chunks.push(current);
  return chunks;
}

function casePages() {
  const s = getCase();
  const p = getPlayer();
  const source = [];
  if (p?.storyLog?.length) source.push(['LATEST DEVELOPMENT', p.storyLog[0].text]);
  source.push(['OPENING STORY', s.scenario]);
  source.push(['BACKGROUND', s.backgroundSummary]);
  source.push(['RELATIONSHIPS', s.relationalDilemma]);
  source.push(['ENVIRONMENT', s.environmentalPressure]);
  source.push(['EMOTIONAL CONTEXT', s.emotionalVulnerability]);
  source.push(['WHAT MAY BE UNSAID', s.unspokenVulnerabilities]);
  source.push(['SYSTEM BARRIERS', s.institutionalBarriers]);
  source.push(['OBSERVATIONS', s.fieldObservations]);
  const pages = [];
  source.forEach(([label, text]) => splitText(text).forEach((body, i, arr) => pages.push({ label: arr.length > 1 ? `${label} ${i+1}/${arr.length}` : label, body })));
  return pages;
}

function disciplineClass(discipline='') {
  const d = discipline.toLowerCase();
  if (d.includes('psych')) return 'psychology';
  if (d.includes('public')) return 'public-health';
  if (d.includes('social work')) return 'social-work';
  if (d.includes('nursing')) return 'nursing';
  if (d.includes('communication')) return 'communication';
  if (d.includes('disability')) return 'disability';
  if (d.includes('system')) return 'systems';
  if (d.includes('sociology')) return 'sociology';
  if (d.includes('ethics')) return 'ethics';
  if (d.includes('education')) return 'education';
  return 'generic';
}

const iconFor = (discipline='') => {
  const d = discipline.toLowerCase();
  if (d.includes('psych')) return 'icon_psychology.png';
  if (d.includes('sociology')) return 'icon_sociology.png';
  if (d.includes('social work')) return 'icon_social_work.png';
  if (d.includes('nursing')) return 'icon_nursing.png';
  if (d.includes('public')) return 'icon_public_health.png';
  if (d.includes('disability')) return 'icon_disability_inclusion.png';
  if (d.includes('communication')) return 'icon_communication.png';
  if (d.includes('system')) return 'icon_systems.png';
  return null;
};

}
function controls(left='WHEEL move', right='SIDE select') {

}
function statusStrip(p=getPlayer()) {
  if (!p) return '';
  return `<div class="status-strip"><span>TURN <b>${p.turn}/${p.maxTurns}</b></span><span>CASE <b>${p.progress}/${TARGET_PROGRESS}</b></span><span>TRUST <b>${p.trust}</b></span></div>`;
}
function toastHtml() { return state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''; }
function dots(count, current) { return `<div class="dots">${Array.from({length:count},(_,i)=>`<i class="${i===current?'on':''}"></i>`).join('')}</div>`; }

function homeItems() {
  const items = [];
  if (state.savedSession?.players?.length) items.push({ id:'continue', title:'CONTINUE', sub:`${state.savedSession.mode || 'STORY'} · saved case` });
  items.push(
    { id:'story', title:'STORY MODE', sub:'8 authored branching cases' },

    { id:'pass', title:'PASS THE DEVICE', sub:'2–4 players · same case' },

  return items;
}

  const p = getPlayer();
  const pages = casePages();
  state.casePage = ((state.casePage % pages.length) + pages.length) % pages.length;
  const pg = pages[state.casePage];
  return `<section class="screen board-screen">
    ${topbar((s.clientName || 'CASE').split(' ')[0].toUpperCase(), `${state.casePage+1}/${pages.length}`)}
    ${statusStrip(p)}

function renderTheory() {
  const p = getPlayer();
  const entries = theoryEntries();
  state.cursor = ((state.cursor % entries.length) + entries.length) % entries.length;
  const rowH = 73;
  const offset = Math.max(0, Math.min(entries.length - 3, state.cursor - 1)) * rowH;

  const rows = entries.map((item, i) => {
    if (item.type === 'done') {
      return `<div class="deck-tile utility-tile ${i===state.cursor?'active':''}">
        <div class="tile-kicker">FORMULATION</div>
        <div class="tile-main"><b>Done choosing</b><span>${p.selectedTheoryIds.length} lens${p.selectedTheoryIds.length===1?'':'es'} · ${focusUsed(p)}/${FOCUS_LIMIT} Focus</span></div>

      <div class="tile-main"><b>${esc(card.title)}</b><span>${esc(purpose.label)} · ${esc((card.concept || '').slice(0,86))}${(card.concept||'').length>86?'…':''}</span></div>

}

      <div class="two-actions">${actions.filter(x=>x.id!=='next').map((x,i)=>`<div class="menu-row ${i===state.cursor?'selected':''}"><b>${x.title}</b></div>`).join('')}</div>${controls()}${toastHtml()}</section>`;

    <div class="two-actions">${actions.map((x,i)=>`<div class="menu-row ${i===state.cursor?'selected':''}"><b>${x.title}</b></div>`).join('')}</div>${controls()}${toastHtml()}</section>`;

function renderHelp() {
  const pages=[

    ['THEORY','You draw seven random theory cards. Play up to four within 10 Focus. Cards are not answers; they change what you notice.'],

    ['JOKER','A professional wild can be used once per case. It adds another discipline to the formulation rather than simply awarding points.'],

  ];

}

function render() {
  let html='';
  if(state.screen==='home') html=renderHome();
  else if(state.screen==='caseSelect') html=renderCaseSelect();
  else if(state.screen==='passCount') html=renderPassCount();
  else if(state.screen==='pass') html=renderPass();
  else if(state.screen==='case') html=renderCase();
  else if(state.screen==='consult') html=renderConsult();
  else if(state.screen==='theory') html=renderTheory();
  else if(state.screen==='theoryDetail') html=renderTheoryDetail();
  else if(state.screen==='intervention') html=renderIntervention();
  else if(state.screen==='wild') html=renderWild();
  else if(state.screen==='actionDetail') html=renderActionDetail(state.detail.kind,state.detail.id);
  else if(state.screen==='review') html=renderReview();
  else if(state.screen==='outcome') html=renderOutcome();
  else if(state.screen==='results') html=renderResults();
  else if(state.screen==='help') html=renderHelp();
  app.innerHTML=html;
}

function flash() { app.classList.remove('flash'); void app.offsetWidth; app.classList.add('flash'); }
function toast(text) {
  state.toast=text; render();
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>{ if(state.toast===text){state.toast=null;render();} },1250);
}

function move(delta) {
  flash();
  if(state.screen==='home') {
    const n=homeItems().length; state.cursor=(state.cursor+delta+n)%n;
  } else if(state.screen==='caseSelect') {
    state.caseIndex=(state.caseIndex+delta+CURATED_CASE_SCENARIOS.length)%CURATED_CASE_SCENARIOS.length;
  } else if(state.screen==='passCount') {
    state.playerCount=2+((state.playerCount-2+delta+3)%3);
  } else if(state.screen==='case') {
    const n=casePages().length; state.casePage=(state.casePage+delta+n)%n;
  } else if(state.screen==='consult') {
    const n=consultItems().length; state.cursor=(state.cursor+delta+n)%n;
  } else if(state.screen==='theory') {
    const n=theoryEntries().length; state.cursor=(state.cursor+delta+n)%n;
  } else if(state.screen==='theoryDetail' || state.screen==='actionDetail') {
    const n=state.screen==='theoryDetail'?5:3; state.detail.page=(state.detail.page+delta+n)%n;
  } else if(state.screen==='intervention') {
    const n=interventionEntries().length; state.cursor=(state.cursor+delta+n)%n;
  } else if(state.screen==='wild' && !getPlayer()?.wildUsed) {
    const n=wildEntries().length; state.cursor=(state.cursor+delta+n)%n;
  } else if(state.screen==='review') state.cursor=(state.cursor+delta+2)%2;
  else if(state.screen==='outcome') state.resultPage=(state.resultPage+delta+3)%3;
  else if(state.screen==='results') {
    const n=state.mode==='PASS'?2:resultActions().length; state.cursor=(state.cursor+delta+n)%n;
  } else if(state.screen==='help') state.casePage=(state.casePage+delta+5)%5;
  render();
}

async function select() {
  flash();
  if(state.screen==='home') {
    const item=homeItems()[state.cursor];
    if(item.id==='continue') { restoreSession(state.savedSession); render(); return; }
    if(item.id==='story') { state.mode='STORY'; state.caseIndex=0; state.screen='caseSelect'; state.cursor=0; render(); return; }
    if(item.id==='endless') { state.mode='ENDLESS'; startGame(); return; }
    if(item.id==='pass') { state.mode='PASS'; state.playerCount=2; state.screen='passCount'; state.cursor=0; render(); return; }
    if(item.id==='help') { state.casePage=0; state.screen='help'; render(); return; }
    if(item.id==='clear') { await R1Bridge.clear(); state.savedSession=null; state.cursor=0; toast('Save cleared'); return; }
  }
  else if(state.screen==='caseSelect') startGame();
  else if(state.screen==='passCount') { state.screen='caseSelect'; state.caseIndex=0; state.cursor=0; render(); }
  else if(state.screen==='pass') { state.screen='case'; state.casePage=0; render(); }
  else if(state.screen==='case') { state.screen='consult'; state.cursor=0; render(); persist(); }
  else if(state.screen==='consult') {
    const item=consultItems()[state.cursor];
    if(item.id==='theory') { state.screen='theory'; state.cursor=0; }
    if(item.id==='intervention') { state.screen='intervention'; state.cursor=0; }
    if(item.id==='wild') { state.screen='wild'; state.cursor=0; }
    if(item.id==='review') { state.screen='review'; state.cursor=0; }
    if(item.id==='dossier') { state.screen='case'; state.casePage=0; }
    render();
  }
  else if(state.screen==='theory') {
    const item=theoryEntries()[state.cursor];
    if(item.type==='card') toggleTheory(item.id);
    else if(item.type==='done') { state.screen='consult'; state.cursor=0; render(); }
    else if(item.type==='redraw') refreshHand();
  }
  else if(state.screen==='theoryDetail') { state.screen='theory'; render(); }
  else if(state.screen==='intervention') {
    const item=interventionEntries()[state.cursor];
    if(item.type==='none') { state.screen='consult'; state.cursor=1; render(); }
    else {
      const p=getPlayer(); p.selectedInterventionId = p.selectedInterventionId===item.id ? null : item.id;
      state.screen='consult'; state.cursor=1; render(); persist();
    }
  }
  else if(state.screen==='wild') {
    const p=getPlayer();
    if(p.wildUsed) { state.screen='consult'; state.cursor=2; render(); }
    else {
      const item=wildEntries()[state.cursor];
      if(item.type==='none') { state.screen='consult'; state.cursor=2; render(); }
      else { p.selectedWildId=p.selectedWildId===item.id?null:item.id; state.screen='consult'; state.cursor=2; render(); persist(); }
    }
  }
  else if(state.screen==='actionDetail') { state.screen=state.detail.returnScreen; render(); }
  else if(state.screen==='review') {
    if(state.cursor===0) submitTurn(); else { state.screen='consult'; state.cursor=0; render(); }
  }
  else if(state.screen==='outcome') advanceAfterOutcome();
  else if(state.screen==='results') {
    if(state.mode==='PASS') {
      const items=[{id:'replay'},{id:'home'}]; const item=items[state.cursor];
      if(item.id==='replay') restartCurrentCase(); else goHome();
    } else {
      const item=resultActions()[state.cursor];
      if(item.id==='replay') restartCurrentCase();
      else if(item.id==='next') {
        if(state.mode==='ENDLESS') nextEndlessCase();
        else { state.caseIndex=(state.caseIndex+1)%CURATED_CASE_SCENARIOS.length; startGame(); }
      } else goHome();
    }
  }
  else if(state.screen==='help') { state.screen='home'; state.cursor=0; render(); }
}

function goHome() {
  state.screen='home'; state.cursor=0; state.players=[]; state.activeScenario=null; state.turnResult=null; render();
}

function longPress() {
  flash();
  if(state.screen==='theory') {
    const item=theoryEntries()[state.cursor];
    if(item.type==='card') { state.detail={kind:'theory',id:item.id,page:0}; state.screen='theoryDetail'; render(); }
  } else if(state.screen==='intervention') {
    const item=interventionEntries()[state.cursor];
    if(item.type==='card') { state.detail={kind:'intervention',id:item.id,page:0,returnScreen:'intervention'}; state.screen='actionDetail'; render(); }
  } else if(state.screen==='wild' && !getPlayer()?.wildUsed) {
    const item=wildEntries()[state.cursor];
    if(item.type==='card') { state.detail={kind:'wild',id:item.id,page:0,returnScreen:'wild'}; state.screen='actionDetail'; render(); }
  } else if(['case','consult','review'].includes(state.screen)) {
    toast('Tip: long press cards to inspect their purpose');
  }
}

R1Bridge.onUp(()=>move(-1));
R1Bridge.onDown(()=>move(1));
R1Bridge.onClick(()=>select());
R1Bridge.onLong(()=>longPress());

(async function init(){
  const saved=await R1Bridge.load();
  if(saved?.players?.length) state.savedSession=saved;
  render();
})();

</script>
</body>
